services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: atelier_de_vise
      MYSQL_USER: atelier
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configurează DB_PASSWORD în .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurează MYSQL_ROOT_PASSWORD în .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3101
      APP_ORIGIN: ${APP_ORIGIN:?Configurează adresa HTTPS publică}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: atelier_de_vise
      DB_USER: atelier
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:3101:3101'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
